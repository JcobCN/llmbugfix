# Optional static profile catalog. `ENVIRONMENT_CONFIG_PATH` may point here,
# but the service can start without this file. Profiles created after a
# confirmed remote-URL intake are stored in `DATA_ROOT/generated-environments.yaml`.
#
# When this catalog is used, repository values are supplied by deployment
# environment variables and must point to local Git checkouts. The dynamic
# intake flow does not require FRONTEND_MAIN_REPOSITORY or
# BACKEND_MAIN_REPOSITORY.
environments:
  - id: frontend-main
    name: Frontend Main Web Application
    target: frontend
    repository: "${FRONTEND_MAIN_REPOSITORY}"
    defaultBranch: main
    markdown:
      - environments/frontend-main/ENVIRONMENT.md
      - environments/frontend-main/TESTING.md
    skills:
      - .pi/skills/frontend-runtime/SKILL.md
      - .pi/skills/frontend-testing/SKILL.md
    setupCommands:
      - "pnpm install --offline --frozen-lockfile"
    validationCommands:
      - "pnpm test --offline"
      - "pnpm typecheck"

  - id: backend-main
    name: Backend Core API Service
    target: backend
    repository: "${BACKEND_MAIN_REPOSITORY}"
    defaultBranch: main
    markdown:
      - environments/backend-main/ENVIRONMENT.md
      - environments/backend-main/TESTING.md
    skills:
      - .pi/skills/backend-runtime/SKILL.md
      - .pi/skills/backend-testing/SKILL.md
    setupCommands:
      - "pnpm install --offline --frozen-lockfile"
    validationCommands:
      - "pnpm test --offline"
      - "pnpm typecheck"
